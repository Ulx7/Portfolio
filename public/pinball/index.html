<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>3D Pinball for Windows - Space Cadet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas.emscripten {
      border: 0 none;
      background-color: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      outline: none;
    }
    #status {
      position: absolute;
      color: #38bdf8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 10;
    }
    #progress {
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="status">Loading Space Cadet...</div>
    <progress hidden id="progress" max="100" value="0"></progress>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  </div>

  <script>
    var statusElement = document.getElementById("status");
    var progressElement = document.getElementById("progress");
    var canvasElement = document.getElementById("canvas");

    var Module = {
      preRun: [],
      postRun: [
        function() {
          // Auto-focus canvas so keypresses immediately work
          setTimeout(function() {
            canvasElement.focus();
          }, 200);
        }
      ],
      print: function(text) {
        console.log(text);
      },
      printErr: function(text) {
        console.error(text);
      },
      canvas: (function() {
        return canvasElement;
      })(),
      setStatus: function(text) {
        if (!text) {
          if (statusElement) statusElement.style.display = "none";
          if (canvasElement) {
            canvasElement.style.display = "block";
            canvasElement.focus();
          }
        } else {
          if (statusElement) {
            statusElement.innerHTML = text;
            statusElement.style.display = "block";
          }
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Loading Space Cadet (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")..." : "");
      }
    };

    // Forward Arrow keys to Pinball's native SDL keys:
    // Left Arrow -> Z (KeyZ, code 90)
    // Right Arrow -> / (Slash, code 191)
    // Down Arrow -> Space (Space, code 32)
    function dispatchMappedKey(type, keyCode, code, key) {
      var event = new KeyboardEvent(type, {
        bubbles: true,
        cancelable: true,
        keyCode: keyCode,
        which: keyCode,
        charCode: 0,
        code: code,
        key: key
      });
      window.dispatchEvent(event);
      canvasElement.dispatchEvent(event);
    }

    window.addEventListener("keydown", function(e) {
      if (e.code === "ArrowLeft") {
        e.preventDefault();
        dispatchMappedKey("keydown", 90, "KeyZ", "z");
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        dispatchMappedKey("keydown", 191, "Slash", "/");
      } else if (e.code === "ArrowDown") {
        e.preventDefault();
        dispatchMappedKey("keydown", 32, "Space", " ");
      }
    }, true);

    window.addEventListener("keyup", function(e) {
      if (e.code === "ArrowLeft") {
        e.preventDefault();
        dispatchMappedKey("keyup", 90, "KeyZ", "z");
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        dispatchMappedKey("keyup", 191, "Slash", "/");
      } else if (e.code === "ArrowDown") {
        e.preventDefault();
        dispatchMappedKey("keyup", 32, "Space", " ");
      }
    }, true);

    // Keep canvas focused on click anywhere in body
    document.body.addEventListener("click", function() {
      canvasElement.focus();
    });
  </script>
  <script async src="SpaceCadetPinball.js"></script>
</body>
</html>
